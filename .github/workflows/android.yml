name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Opcjonalny własny klucz podpisu (sekrety)
        env:
          KS_B64: ${{ secrets.MNEMO_KEYSTORE_BASE64 }}
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "MNEMO_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          MNEMO_KEYSTORE_PASSWORD: ${{ secrets.MNEMO_KEYSTORE_PASSWORD }}
          MNEMO_KEY_ALIAS: ${{ secrets.MNEMO_KEY_ALIAS }}
          MNEMO_KEY_PASSWORD: ${{ secrets.MNEMO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Mnemo-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mnemo-apk-${{ github.run_number }}
          path: out/*.apk

      - name: GitHub Release (dla tagów v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
